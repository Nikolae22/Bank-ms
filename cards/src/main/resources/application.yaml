spring:
  application:
    name: cards
  datasource:
    url: jdbc:mysql://localhost:3307/cardsdb
    username: we
    password: we
  jpa:
    show-sql: true
  sql:
    init:
      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"

  profiles:
    active:
      - "prod"
      #- "qa"


server:
  port: ${SERVER_PORT:9000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"