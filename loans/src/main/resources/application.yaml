spring:
  application:
    name: loans
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:loansdb
    username: we
    password: we
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true


server:
  port: ${SERVER_PORT:8090}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

build:
  version: 2.0

loans:
  message: "This is loans ms API "
  contactDetails:
    name: "Java backend"
    email: "whoKnows@gmail.com"
  onCallSupport:
    - "00000000"
    - "11111111"