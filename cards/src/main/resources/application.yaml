spring:
  application:
    name: cards
  datasource:
    url: "jdbc:h2:mem:cardsdb"
    driverClassName: "org.h2.Driver"
    username: we
    password: we
    h2:
      console:
        enabled: true
    jpa:
      database-platform: "org.hibernate.dialect.H2Dialect"
      hibernate:
        ddl-auto: update
      show-sql: true
#  datasource:
#    url: jdbc:mysql://localhost:3307/cardsdb
#    username: we
#    password: we
#  jpa:
#    show-sql: true
#  sql:
#    init:
#      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"

  profiles:
    active:
      - "prod"
      #- "qa"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

server:
  port: ${SERVER_PORT:9000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "accounts"
    description: "Accounts ms"
    version: "1.0.0"