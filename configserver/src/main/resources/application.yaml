spring:
  application:
    name: configserver

  profiles:
    active: git
    #active: native #questo native dice aconfigsevrer di prenderel e configgurazioni da qua
  cloud:
    config:
      server:
        monitor:
          validation-filter-enabled: false
        git:
          uri: "https://github.com/Nikolae22/application-confg.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
#        native:
#          search-locations: classpath:/config
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
encrypt:
  key: "89SA7DUAISDHA83923IUAWHJKDAS8"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true


server:
  port: 8071
