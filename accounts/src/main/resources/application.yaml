spring:
  application:
    name: accounts
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:accountsdb
    username: we
    password: we
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true

  profiles:
    active:
      - "qa"
      #- "prod"


server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

build:
  version: 1.0

accounts:
  message: "This is accounts ms API"
  contactDetails:
    name: "Java developer easy"
    email: "whoKnows@gmail.com"
  onCallSupport:
    - "00000000"
    - "11111111"
