spring:
  application:
    name: cards
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:cardsdb
    username: we
    password: we
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true


server:
  port: ${SERVER_PORT:9000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

build:
  version: 1.0

cards:
  message: "This is cards ms API"
  contactDetails:
    name: "Java developer easy"
    email: "whoKnows@gmail.com"
  onCallSupport:
    - "00000000"
    - "11111111"